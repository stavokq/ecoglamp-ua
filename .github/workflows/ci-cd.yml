name: CI/CD Pipeline - Build, Test & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  AZURE_WEBAPP_NAME: 'ecoglamp-ua'

jobs:
  build:
    name: Build & Test Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore src/WebLab/WebLab.csproj

    - name: Build solution (Release)
      run: dotnet build src/WebLab/WebLab.csproj --configuration Release --no-restore

    - name: Publish application
      run: dotnet publish src/WebLab/WebLab.csproj --configuration Release -o ./publish /p:UseAppHost=false

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp-artifact
        path: ./publish

  docker-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: ecoglamp-weblab:latest

  deploy-to-azure:
    name: Continuous Deployment (Azure App Service)
    runs-on: ubuntu-latest
    needs: [build, docker-check]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: webapp-artifact
        path: ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      continue-on-error: true
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish

  deploy-webhook:
    name: Deploy to Cloud Webhook
    runs-on: ubuntu-latest
    needs: [build, docker-check]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
    - name: Trigger Cloud Deploy Webhook
      run: |
        if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
          curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
        fi
